<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E5A100"/>
      <stop offset="100%" style="stop-color:#B58000"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1A1A1A"/>
  <!-- Road swoosh -->
  <path d="M30 140 Q60 100 100 100 Q140 100 170 60"
        stroke="url(#roadGrad)" stroke-width="24" fill="none" stroke-linecap="round"/>
  <!-- Road center line -->
  <path d="M45 130 Q70 100 100 100 Q130 100 155 70"
        stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="12 8"/>
  <!-- SW Text -->
  <text x="100" y="175" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="#E5A100">SAFE WAY</text>
</svg>
