<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>K53 Learner's Licence — Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app/styles.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="app/data.js"></script>
<script src="app/themes.js"></script>
<script type="text/babel" src="app/signs.jsx"></script>
<script type="text/babel" src="app/ui.jsx"></script>
<script type="text/babel" src="app/screens.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function DirSwitch({ value, onChange }) {
  return (
    <div className="dirswitch">
      {window.THEME_ORDER.map(id => {
        const t = window.THEMES[id];
        return (
          <button key={id} type="button" className={"dir-btn" + (value === id ? " is-on" : "")}
            onClick={() => onChange(id)}>
            <b>{t.label}</b><span>{t.tagline}</span>
          </button>
        );
      })}
    </div>
  );
}

function App() {
  const data = window.QUIZ_DATA;
  const [themeId, setThemeId] = useState(() => localStorage.getItem("k53.dir") || "clearview");
  const [screen, setScreen] = useState("home");   // home | practice | results
  const [config, setConfig] = useState(null);
  const [result, setResult] = useState(null);
  const [runKey, setRunKey] = useState(0);

  useEffect(() => { localStorage.setItem("k53.dir", themeId); }, [themeId]);

  const theme = window.THEMES[themeId];

  function start(cfg) { setConfig(cfg); setResult(null); setRunKey(k => k + 1); setScreen("practice"); }
  function finish(res) { setResult(res); setScreen("results"); window.scrollTo(0, 0); }
  function retry() { setRunKey(k => k + 1); setResult(null); setScreen("practice"); window.scrollTo(0, 0); }
  function home() { setScreen("home"); window.scrollTo(0, 0); }

  return (
    <React.Fragment>
      <div className="reviewbar">
        <div className="reviewbar-brand"><span className="dot" />K53 Practice — design directions</div>
        <DirSwitch value={themeId} onChange={setThemeId} />
        <div className="reviewbar-label">{theme.label} · {screen}</div>
      </div>

      <div className="stage" style={theme.vars}>
        <div className="app">
          <div className="screen-anim" key={themeId + screen + runKey}>
            {screen === "home" && <Home data={data} onStart={start} />}
            {screen === "practice" && (
              <Practice data={data} theme={theme} config={config}
                onFinish={finish} onExit={home} />
            )}
            {screen === "results" && result && (
              <Results data={data} result={result} onRetry={retry} onHome={home} />
            )}
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
